name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch: only the newest push matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fail the build on any warning. The lint set is defined in the workspace
  # manifest, so this makes those lints binding rather than advisory.
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: 1

jobs:
  format:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup component add rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup component add clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Run the test suite
        run: cargo test --workspace --all-features

  # The renderer needs a Vulkan device. GitHub's hosted runners have no GPU, so
  # Mesa's lavapipe software driver stands in — it is a conformant Vulkan
  # implementation, which is what makes the golden-image tests meaningful here.
  render:
    name: headless renderer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the software Vulkan driver
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools
      - uses: Swatinem/rust-cache@v2
      - name: Run renderer tests against lavapipe
        env:
          # Pin adapter selection so a run never silently falls back to a
          # different device and invalidates the golden images.
          WGPU_BACKEND: vulkan
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          VERDANT_HEADLESS: "1"
        run: cargo test --workspace --all-features -- --include-ignored
      - name: Upload golden-image diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-image-diffs
          path: target/golden-diffs/
          if-no-files-found: ignore

  # Determinism is the property that is nearly impossible to retrofit, so it
  # gets its own job: the same seeded simulation must produce the same state
  # hash on every operating system in the matrix.
  determinism:
    name: cross-platform determinism (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Record the simulation fingerprint
        run: cargo test --workspace --all-features determinism -- --nocapture

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Build documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --all-features

  build:
    name: release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install windowing and audio development headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release
